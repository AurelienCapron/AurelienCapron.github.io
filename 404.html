<!DOCTYPE html>
<html lang="fr">
<head>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  PAGE 404 — GitHub Pages affiche automatiquement ce fichier           ║
  ║  quand une URL du site n'existe pas (page supprimée, lien cassé...). ║
  ║  Aucune configuration nécessaire : il suffit qu'il soit à la racine  ║
  ║  du dépôt, au même niveau que index.html.                            ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Aurélien CAPRON</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121519'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='28' font-weight='700' text-anchor='middle' fill='%2310b981'%3EAC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e11; --surface: rgba(18,21,25,.7); --border: rgba(255,255,255,.1);
    --text: #cbd5e1; --text-strong: #ffffff; --text-muted: #94a3b8;
    --accent: #10b981; --accent-soft: #34d399;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --surface: rgba(255,255,255,.8); --border: rgba(15,23,42,.1);
      --text: #334155; --text-strong: #0f172a; --text-muted: #64748b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 2rem;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    text-align: center;
  }
  .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: clamp(3.5rem, 12vw, 6rem); font-weight: 700; line-height: 1;
    color: var(--accent); margin: 0;
    text-shadow: 0 0 40px rgba(16,185,129,.25);
  }
  h1 { color: var(--text-strong); font-size: clamp(1.25rem, 3vw, 1.75rem); margin: .75rem 0 .5rem; }
  p { color: var(--text-muted); max-width: 36ch; margin: 0 auto 1.75rem; line-height: 1.6; }
  a.home {
    display: inline-flex; align-items: center; gap: .5rem;
    background: var(--accent); color: #0c0e11; font-weight: 600; font-size: .9rem;
    padding: .75rem 1.5rem; border-radius: .5rem; text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  a.home:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16,185,129,.35); }
  a.home:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; }
</style>
</head>
<body>
  <div>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page introuvable</h1>
    <p>Ce lien n'existe pas ou a été déplacé. Retourne à l'accueil pour retrouver mes projets, mon parcours et mes coordonnées.</p>
    <!-- 🔗 Si le site est publié dans un sous-dossier, adapte le href ci-dessous -->
    <a class="home" href="/">← Retour à l'accueil</a>
  </div>
</body>
</html>
